<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Blue black hole">
  <defs>
    <radialGradient id="void" cx="50%" cy="52%" r="46%">
      <stop offset="0%" stop-color="oklch(0.01 0.01 260)" />
      <stop offset="68%" stop-color="oklch(0.015 0.01 250)" />
      <stop offset="100%" stop-color="oklch(0.04 0.08 220)" />
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="oklch(0.78 0.18 205 / 0.95)" />
      <stop offset="46%" stop-color="oklch(0.66 0.2 215 / 0.55)" />
      <stop offset="100%" stop-color="oklch(0.42 0.13 225 / 0)" />
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="streak" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="none" />
  <g transform="translate(256 256)">
    <ellipse rx="215" ry="145" fill="url(#haze)" opacity="0.55" filter="url(#soft)" transform="rotate(-22)" />
    <ellipse rx="196" ry="118" fill="none" stroke="oklch(0.64 0.2 215 / 0.34)" stroke-width="18" filter="url(#soft)" transform="rotate(-22)" />
    <ellipse rx="176" ry="100" fill="none" stroke="oklch(0.82 0.18 200 / 0.88)" stroke-width="14" filter="url(#streak)" transform="rotate(-20)" stroke-linecap="round" stroke-dasharray="460 130 120 90" />
    <ellipse rx="162" ry="88" fill="none" stroke="oklch(0.9 0.12 195 / 0.82)" stroke-width="7" filter="url(#streak)" transform="rotate(-18)" stroke-linecap="round" stroke-dasharray="300 120 180 80" />
    <ellipse rx="205" ry="135" fill="none" stroke="oklch(0.5 0.18 220 / 0.42)" stroke-width="3" transform="rotate(-26)" stroke-dasharray="160 60 90 140" />
    <ellipse rx="232" ry="153" fill="none" stroke="oklch(0.46 0.14 220 / 0.23)" stroke-width="2" transform="rotate(-28)" stroke-dasharray="220 210" />
    <circle r="109" fill="url(#void)" />
    <circle r="111" fill="none" stroke="oklch(0.88 0.18 200 / 0.92)" stroke-width="4" filter="url(#streak)" />
    <circle r="124" fill="none" stroke="oklch(0.57 0.18 215 / 0.3)" stroke-width="18" filter="url(#soft)" />
